[project]
name = "chief"
version = "0.1.0"
description = "Chief: an always-on AI chief of staff for teams, built on Switch"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx",
  "typesafe-sdk",
  "anthropic",
  "pyyaml",
  "python-frontmatter",
  "fastapi",
  "uvicorn",
]

[project.scripts]
chief = "chief.main:run"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chief", "connectors", "mochi_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
