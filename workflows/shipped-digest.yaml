# Shipped digest: release-scribe (ship) writes it; the video role (designer) is optional.
version: 1
params:
  brief:
    type: string
    multiline: true
    label: Brief
    description: Which repo, and anything to stress in the digest.
  asker:
    type: user
    label: Asker
room:
  name: work-shipped-digest-{$timestamp}
  description: Write the weekly shipped digest.
  channel_type: channel_private
  agents: [ship, designer, chief]
  users: ["{asker}"]
  roles:
    - name: release-scribe
      instructions: Write the digest from merged PRs and releases of the last 7 days, then post DONE.
    - name: video
      instructions: Only if the brief asks for a video, make a short one from the digest.
  instructions: |
    Shipped digest for {asker}.

    Brief:
    {brief}

    Steps:
    1. The release-scribe (ship) writes the digest in this thread.
    2. If the brief asks for a video, ship then addresses @designer (the video role) with the digest. designer makes the video, replies in the thread, and does not @ anyone.
    3. If the brief does not ask for a video, skip step 2. The release-scribe posts DONE on its own line; that ends the work. With a video, ship posts DONE after designer replies.
kickoff: |
  @ship take the release-scribe role. Read the brief in the room instructions and write the digest as your CLAUDE.md says. If the brief asks for a video, address designer next, as the room instructions say. Post DONE when finished.
